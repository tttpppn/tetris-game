<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 10px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .game-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: flex-start;
            flex-direction: row;
            flex-wrap: nowrap;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        canvas {
            border: 3px solid #fff;
            background: #000;
            display: block;
            width: 100%;
            max-width: 240px;
            height: auto;
            aspect-ratio: 200 / 400;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        .controls {
            color: #fff;
            text-align: center;
            width: 100%;
        }

        .controls p {
            margin: 8px 0;
            font-size: 12px;
            color: #aaa;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
            flex: 1;
            min-width: 100px;
        }

        button:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info {
            color: #fff;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            min-width: 140px;
            flex-shrink: 0;
        }

        .info-item {
            margin: 12px 0;
            font-size: 14px;
        }

        .label {
            color: #aaa;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-top: 4px;
        }

        #nextCanvas {
            margin-top: 8px;
            border: 2px solid #667eea;
            background: #111;
            width: 100%;
            max-width: 100px;
            height: 100px;
            image-rendering: pixelated;
        }

        .touch-controls {
            display: none;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .touch-button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .rotate-btn {
            background: #f0a000;
        }

        .rotate-btn:hover {
            background: #ff9500;
        }

        .drop-btn {
            background: #f00000;
            grid-column: 1 / -1;
        }

        .drop-btn:hover {
            background: #cc0000;
        }

        .sound-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            border: 2px solid white;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: background 0.3s;
        }

        .sound-toggle:hover {
            background: #764ba2;
        }

        .sound-toggle.muted {
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 15px;
                gap: 15px;
                max-width: 100%;
                border-radius: 5px;
            }

            .game-wrapper {
                flex-direction: column;
                gap: 15px;
                flex-wrap: wrap;
                align-items: center;
            }

            .info {
                width: 100%;
                min-width: unset;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }

            .info-item {
                margin: 0;
            }

            canvas {
                max-width: 100%;
                width: 100%;
            }

            .controls p {
                font-size: 11px;
            }

            .touch-controls {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }

            button {
                padding: 12px 15px;
                font-size: 12px;
                min-width: unset;
            }

            .sound-toggle {
                width: 45px;
                height: 45px;
                font-size: 18px;
                top: 5px;
                right: 5px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 10px;
            }

            .info {
                grid-template-columns: repeat(2, 1fr);
                padding: 8px;
            }

            .value {
                font-size: 18px;
            }

            .label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle" title="Toggle sound">🔊</button>

    <div class="container">
        <div class="game-wrapper">
            <div class="game-area">
                <canvas id="gameCanvas" width="200" height="400"></canvas>
                <div class="controls">
                    <p>Desktop: ← → Move | ↑ Rotate | ↓ Soft Drop | Space Hard Drop</p>
                    <div class="button-group">
                        <button id="pauseBtn">Pause</button>
                        <button id="resetBtn">New Game</button>
                    </div>
                    <div class="touch-controls" id="touchControls">
                        <button class="touch-button" id="leftBtn">◀ Left</button>
                        <button class="touch-button" id="rightBtn">Right ▶</button>
                        <button class="touch-button rotate-btn" id="rotateBtn">↻ Rotate</button>
                        <button class="touch-button drop-btn" id="dropBtn">⬇ Drop</button>
                    </div>
                </div>
            </div>
            <div class="info">
                <div class="info-item">
                    <div class="label">SCORE</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="info-item">
                    <div class="label">LINES</div>
                    <div class="value" id="lines">0</div>
                </div>
                <div class="info-item">
                    <div class="label">LEVEL</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="info-item">
                    <div class="label">NEXT</div>
                    <canvas id="nextCanvas" width="80" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Audio context for sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let soundEnabled = localStorage.getItem('tetrisSoundEnabled') !== 'false';

        const soundToggle = document.getElementById('soundToggle');
        soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
        soundToggle.classList.toggle('muted', !soundEnabled);

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('tetrisSoundEnabled', soundEnabled);
            soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
            soundToggle.classList.toggle('muted', !soundEnabled);
        });

        // Sound generation functions
        function playSound(frequency, duration, type = 'sine', volume = 0.3) {
            if (!soundEnabled) return;

            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();

                osc.type = type;
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(volume, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.warn('Sound playback failed:', e);
            }
        }

        function playPlaceSound() {
            playSound(200, 0.1, 'sine', 0.2);
            playSound(250, 0.1, 'sine', 0.2);
        }

        function playClearSound() {
            // Rock crushing sound - multi-layered impact with settling debris
            if (!soundEnabled) return;

            // Main impact - deep low frequency
            playSound(140, 0.12, 'square', 0.6);
            playSound(180, 0.1, 'square', 0.5);

            // Secondary crack with harmonics
            setTimeout(() => {
                playSound(110, 0.08, 'sawtooth', 0.4);
                playSound(220, 0.08, 'sawtooth', 0.35);
                playSound(330, 0.08, 'sawtooth', 0.3);
            }, 60);

            // Debris falling and settling
            setTimeout(() => playSound(400, 0.08, 'sawtooth', 0.3), 140);
            setTimeout(() => playSound(280, 0.1, 'sawtooth', 0.3), 200);
            setTimeout(() => playSound(200, 0.12, 'sawtooth', 0.28), 270);
            setTimeout(() => playSound(140, 0.14, 'square', 0.25), 350);
            setTimeout(() => playSound(90, 0.15, 'square', 0.2), 430);

            // Final settling crunch
            setTimeout(() => playSound(70, 0.2, 'sawtooth', 0.15), 500);
        }

        function playRotateSound() {
            playSound(350, 0.05, 'sine', 0.15);
        }

        function playMoveSound() {
            playSound(300, 0.03, 'sine', 0.1);
        }

        function playGameOverSound() {
            playSound(200, 0.3, 'sine', 0.4);
            playSound(150, 0.3, 'sine', 0.4);
            playSound(100, 0.5, 'sine', 0.4);
        }

        // Background music system
        let backgroundMusicActive = false;
        let musicNoteIndex = 0;
        let musicTempo = 400;
        const musicNotes = [
            { freq: 400, duration: 0.25 },
            { freq: 500, duration: 0.25 },
            { freq: 600, duration: 0.25 },
            { freq: 500, duration: 0.25 },
            { freq: 400, duration: 0.5 }
        ];

        function playBackgroundMusic() {
            if (!soundEnabled || !backgroundMusicActive) return;

            const note = musicNotes[musicNoteIndex % musicNotes.length];
            playSound(note.freq, note.duration, 'sine', 0.15);
            musicNoteIndex++;

            // Schedule next note with current tempo
            setTimeout(playBackgroundMusic, musicTempo);
        }

        function getStackHeight() {
            let maxHeight = 0;
            for (let row = 0; row < ROWS; row++) {
                if (board[row].some(cell => cell)) {
                    maxHeight = ROWS - row;
                }
            }
            return maxHeight;
        }

        function updateBackgroundMusic() {
            const stackHeight = getStackHeight();
            const fillPercentage = (stackHeight / ROWS) * 100;
            const wasActive = backgroundMusicActive;

            // Start music when >75% full
            backgroundMusicActive = fillPercentage > 75;

            // Increase tempo as stack gets higher (faster when more full)
            if (backgroundMusicActive) {
                musicTempo = Math.max(150, 400 - (fillPercentage * 3));
            }

            // Start playing if just activated
            if (backgroundMusicActive && !wasActive) {
                playBackgroundMusic();
            }
        }

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = canvas.width / COLS;

        const TETRIS_PIECES = [
            { shape: [[1,1,1,1]], color: '#d0d0d0' }, // I - Light grey marble
            { shape: [[1,1],[1,1]], color: '#e8e8e8' }, // O - White marble
            { shape: [[0,1,1],[1,1,0]], color: '#c0a080' }, // S - Tan marble
            { shape: [[1,1,0],[0,1,1]], color: '#4a4a4a' }, // Z - Dark grey marble
            { shape: [[1,0,0],[1,1,1]], color: '#b8860b' }, // J - Golden marble
            { shape: [[0,0,1],[1,1,1]], color: '#8b7d6b' }, // L - Brown marble
            { shape: [[0,1,0],[1,1,1]], color: '#a9a9a9' } // T - Dark grey marble
        ];

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let level = 1;
        let gameOver = false;
        let paused = false;
        let dropCounter = 0;
        let dropInterval = 800;
        let crumbleEffect = [];
        let crumbleTime = 0;

        // Detect if touch controls needed
        const touchControls = document.getElementById('touchControls');
        const isMobile = () => window.innerWidth <= 600 || window.matchMedia("(hover: none)").matches;

        if (isMobile()) {
            touchControls.style.display = 'grid';
        }

        window.addEventListener('resize', () => {
            if (isMobile()) {
                touchControls.style.display = 'grid';
            } else {
                touchControls.style.display = 'none';
            }
        });

        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }

        function getRandomPiece() {
            const piece = JSON.parse(JSON.stringify(TETRIS_PIECES[Math.floor(Math.random() * TETRIS_PIECES.length)]));
            piece.x = Math.floor(COLS / 2) - Math.floor(piece.shape[0].length / 2);
            piece.y = 0;
            return piece;
        }

        function spawn() {
            currentPiece = nextPiece || getRandomPiece();
            nextPiece = getRandomPiece();

            if (collides(currentPiece.shape, currentPiece.x, currentPiece.y)) {
                gameOver = true;
                playGameOverSound();
            }
        }

        function collides(shape, x, y) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col]) {
                        const newX = x + col;
                        const newY = y + row;
                        if (newX < 0 || newX >= COLS || newY >= ROWS || (newY >= 0 && board[newY][newX])) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function place() {
            for (let row = 0; row < currentPiece.shape.length; row++) {
                for (let col = 0; col < currentPiece.shape[row].length; col++) {
                    if (currentPiece.shape[row][col]) {
                        const x = currentPiece.x + col;
                        const y = currentPiece.y + row;
                        if (y >= 0) board[y][x] = currentPiece.color;
                    }
                }
            }
            playPlaceSound();
            clearLines();
            spawn();
        }

        function createCrumbleEffect(row) {
            for (let col = 0; col < COLS; col++) {
                if (board[row][col]) {
                    crumbleEffect.push({
                        x: col * BLOCK_SIZE + BLOCK_SIZE / 2,
                        y: row * BLOCK_SIZE + BLOCK_SIZE / 2,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 3 + 1,
                        size: BLOCK_SIZE * 0.4,
                        color: board[row][col],
                        life: 0.3
                    });
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;
            const rowsToClear = [];

            for (let row = ROWS - 1; row >= 0; row--) {
                if (board[row].every(cell => cell)) {
                    rowsToClear.push(row);
                    linesCleared++;
                }
            }

            if (linesCleared) {
                // Create crumble effect for each row being cleared
                rowsToClear.forEach(row => createCrumbleEffect(row));

                // Clear rows
                rowsToClear.forEach(row => {
                    board.splice(row, 1);
                    board.unshift(Array(COLS).fill(0));
                });

                playClearSound();
                lines += linesCleared;
                score += [40, 100, 300, 1200][linesCleared - 1] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 800 - (level - 1) * 50);
                crumbleTime = 0;
            }
        }

        function rotate() {
            const rotated = currentPiece.shape[0].map((_, col) =>
                currentPiece.shape.map(row => row[col]).reverse()
            );
            if (!collides(rotated, currentPiece.x, currentPiece.y)) {
                currentPiece.shape = rotated;
                playRotateSound();
            }
        }

        function moveLeft() {
            if (!collides(currentPiece.shape, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.x--;
                playMoveSound();
            }
        }

        function moveRight() {
            if (!collides(currentPiece.shape, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.x++;
                playMoveSound();
            }
        }

        function softDrop() {
            if (!collides(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                score += level;
                playMoveSound();
            } else {
                place();
            }
        }

        function drawIceCrystal(x, y, size, color) {
            // Draw ice crystal block with gradient and highlights
            const grad = ctx.createLinearGradient(x, y, x + size, y + size);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
            grad.addColorStop(0.5, color);
            grad.addColorStop(1, 'rgba(0, 0, 50, 0.5)');

            ctx.fillStyle = grad;
            ctx.fillRect(x, y, size, size);

            // Add crystalline border
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, size, size);

            // Add inner highlight for ice effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fillRect(x + 1, y + 1, size / 3, size / 3);
            ctx.fillRect(x + size - size/3 - 1, y + size - size/3 - 1, size / 3, size / 3);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw board
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    if (board[row][col]) {
                        drawIceCrystal(col * BLOCK_SIZE, row * BLOCK_SIZE, BLOCK_SIZE - 1, board[row][col]);
                    }
                }
            }

            // Draw current piece
            if (currentPiece) {
                for (let row = 0; row < currentPiece.shape.length; row++) {
                    for (let col = 0; col < currentPiece.shape[row].length; col++) {
                        if (currentPiece.shape[row][col]) {
                            const x = (currentPiece.x + col) * BLOCK_SIZE;
                            const y = (currentPiece.y + row) * BLOCK_SIZE;
                            drawIceCrystal(x, y, BLOCK_SIZE - 1, currentPiece.color);
                        }
                    }
                }
            }

            // Draw next piece preview
            nextCtx.fillStyle = '#111';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (nextPiece) {
                for (let row = 0; row < nextPiece.shape.length; row++) {
                    for (let col = 0; col < nextPiece.shape[row].length; col++) {
                        if (nextPiece.shape[row][col]) {
                            const x = col * 20 + 10;
                            const y = row * 20 + 10;
                            // Draw ice crystal for next piece
                            const grad = nextCtx.createLinearGradient(x, y, x + 18, y + 18);
                            grad.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                            grad.addColorStop(0.5, nextPiece.color);
                            grad.addColorStop(1, 'rgba(0, 0, 50, 0.5)');

                            nextCtx.fillStyle = grad;
                            nextCtx.fillRect(x, y, 18, 18);

                            nextCtx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
                            nextCtx.lineWidth = 1;
                            nextCtx.strokeRect(x, y, 18, 18);

                            nextCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                            nextCtx.fillRect(x + 1, y + 1, 6, 6);
                        }
                    }
                }
            }

            // Draw crumble particles
            for (let particle of crumbleEffect) {
                const alpha = Math.max(0, particle.life - crumbleTime);
                ctx.fillStyle = particle.color.replace(')', ', ' + alpha + ')').replace('rgb', 'rgba');
                ctx.fillRect(particle.x - particle.size / 2, particle.y - particle.size / 2, particle.size, particle.size);
            }

            // Draw game over message
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                ctx.font = '16px Arial';
                ctx.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 15);
            }

            document.getElementById('score').textContent = score;
            document.getElementById('lines').textContent = lines;
            document.getElementById('level').textContent = level;
        }

        function update(deltaTime) {
            if (gameOver || paused) return;

            // Update crumble particles
            crumbleTime += deltaTime / 1000;
            crumbleEffect = crumbleEffect.filter(p => crumbleTime < p.life);
            crumbleEffect.forEach(p => {
                p.y += p.vy;
                p.vy += 0.15; // gravity
                p.vx *= 0.98; // air resistance
            });

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                if (collides(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                    place();
                    updateBackgroundMusic();
                } else {
                    currentPiece.y++;
                }
                dropCounter = 0;
            }
        }

        function hardDrop() {
            while (!collides(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
            }
            place();
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (gameOver || paused) return;
            if (e.key === 'ArrowLeft') {
                moveLeft();
            } else if (e.key === 'ArrowRight') {
                moveRight();
            } else if (e.key === 'ArrowUp') {
                rotate();
            } else if (e.key === 'ArrowDown') {
                softDrop();
            } else if (e.key === ' ') {
                hardDrop();
                e.preventDefault();
            }
        });

        // Button controls
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (!gameOver) {
                paused = !paused;
                document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            initBoard();
            score = 0;
            lines = 0;
            level = 1;
            gameOver = false;
            paused = false;
            dropCounter = 0;
            dropInterval = 800;
            currentPiece = null;
            nextPiece = null;
            backgroundMusicActive = false;
            musicNoteIndex = 0;
            crumbleEffect = [];
            crumbleTime = 0;
            spawn();
            document.getElementById('pauseBtn').textContent = 'Pause';
        });

        // Touch controls
        document.getElementById('leftBtn').addEventListener('click', () => {
            if (!gameOver && !paused) moveLeft();
        });

        document.getElementById('rightBtn').addEventListener('click', () => {
            if (!gameOver && !paused) moveRight();
        });

        document.getElementById('rotateBtn').addEventListener('click', () => {
            if (!gameOver && !paused) rotate();
        });

        document.getElementById('dropBtn').addEventListener('click', () => {
            if (!gameOver && !paused) hardDrop();
        });

        let lastTime = Date.now();
        function gameLoop() {
            const currentTime = Date.now();
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        initBoard();
        spawn();
        gameLoop();

        // Resume audio context on user interaction
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        });
    </script>
</body>
</html>
